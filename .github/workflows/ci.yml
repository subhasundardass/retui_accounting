name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.3", "1.23"]  # Include the version from go.mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./retui/...

      - name: Vet
        run: go vet ./retui/...

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l ./retui)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          go test ./retui/... -v -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./retui/...

      - name: Display coverage summary
        run: |
          go tool cover -func=coverage.out | grep total

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.go-version }}
          path: coverage.out

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            coverage.out
            *.test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
          working-directory: ./retui

      - name: Install additional linters (optional)
        run: |
          go install github.com/go-critic/go-critic/cmd/gocritic@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run gocritic (optional - non-failing)
        run: |
          gocritic check -enableAll ./retui/... 2>/dev/null || true

      - name: Run staticcheck (optional - non-failing)
        run: |
          staticcheck ./retui/... 2>/dev/null || true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./retui/...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"  # Use the version from go.mod
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./retui/...

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            vuln-report.json